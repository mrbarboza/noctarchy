# Btop config (from Omarchy)
# Zero DHH/HEY references

# Color theme: Catppuccin Mocha
theme = "Catppuccin"

# Refresh rate in milliseconds
update_ms = 1000

# Show CPU temperature
cpu_temp = true

# Show CPU graph
show_coretemp = true

# Show battery
show_battery = true

# Show network graph
show_network = true

# Network interfaces
net_iface = "auto"

# Show process info
proc_sorting = "cpu percent"
proc_reversed = false

# Tree view
proc_tree = false

# Show custom user processes
proc_user = ""

# Show CPU graph
show_cpu_graph = true

# Show memory graph
show_mem_graph = true

# Show network graph
show_net_graph = true

# Graph symbols
graph_symbol = "braille"

# Rounded corners
rounded_corners = true

# Show help hint
show_help_hint = true
