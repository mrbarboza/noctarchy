# Kitty terminal config (from Omarchy)
# Zero DHH/HEY references

font_family      monospace
bold_font        monospace
italic_font      monospace
bold_italic_font monospace

font_size 11.0

# Theme: Catppuccin Mocha
cursor_shape Underline

# Colors: Catppuccin Mocha
include catppuccin-mocha.conf

# Cursor
cursor #f5e0dc
cursor_text_color #1e1e2e

# Selection
selection_foreground #1e1e2e
selection_background #cdd6f4

# URL hints
url_style curly

# Tabs
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Keyboard
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+n new_os_window_with_cwd
map ctrl+shift+w close_window
map ctrl+shift+] next_window
map ctrl+shift+[ previous_window
map ctrl+shift+f toggle_fullscreen
map ctrl+shift+space toggle_maximized

# Mouse
mouse_hide_wait 3.0

# Scrollback
scrollback_lines 10000

# Pager
pager less +
