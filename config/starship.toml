# Tokyo Night theme for Starship prompt
# Source: themes/tokyo-night/colors.toml

format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$time\
$line_break\
$character\
"""

# Colors
[palette]
success = "#9ece6a"
error = "#f7768e"
warning = "#e0af68"
info = "#7aa2f7"
purple = "#bb9af7"
cyan = "#7dcfff"
yellow = "#e0af68"
red = "#f7768e"
green = "#9ece6a"
blue = "#7aa2f7"
white = "#c0caf5"
gray = "#565f89"

# Modules
[username]
style_user = "green bold"
style_root = "red bold"
format = "[\$user](bold green)@"
disabled = false

[hostname]
ssh_only = false
format = "[$hostname](bold cyan) "
disabled = false

[directory]
read_only = " ro"
truncation_length = 4
truncation_symbol = "…/"
style = "bold blue"
format = "[\$path ]($style)"

[git_branch]
symbol = " "
format = "[\$symbol](purple) [\$branch ](bold purple)"
style = "bold purple"

[git_status]
format = "[\([$all_status$ahead_behind\]) ](bold red)"
style = "bold red"

[fill]
symbol = " "
style = "gray"

[time]
disabled = false
time_format = "%R"
format = "[\$time](dimmed yellow)"
style = "bold yellow"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vicmd_symbol = "[❮](bold purple)"
