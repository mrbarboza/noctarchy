# Tmux config (from Omarchy)
# Zero DHH/HEY references

# === General ===
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# === Prefix ===
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# === Split panes ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h
bind - split-window -v

# === Navigation ===
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# === Resize panes ===
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# === Windows ===
bind c new-window -c "#{pane_current_path}"
bind , command-prompt "rename-window '%%'"
bind & confirm-before "kill-window"
bind x confirm-before "kill-pane"

# === Copy mode ===
bind [ copy-mode
bind ] paste-buffer

# === Clipboard ===
# set -g set-clipboard on

# === Status bar ===
set -g status on
set -g status-justify centre
set -g status-bg colour236
set -g status-fg colour255
set -g status-left "#[bold]#S "
set -g status-left-length 10
set -g status-right "#[bold]#H #[fg=colour252]%Y-%m-%d #[fg=colour255]%H:%M "
set -g status-right-length 40

# === Window list ===
setw -g window-status-style "fg=colour252,bg=colour236"
setw -g window-status-current-style "fg=colour235,bg=colour31,bold"

# === Colors (Catppuccin Mocha inspired) ===
set -g @catppuccin_variant "mocha"

# === Plugins (TPM) ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
